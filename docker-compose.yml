services:
  mongodb:
    image: mongo:7
    ports: ["27017:27017"]
    volumes: [mongodb_data:/data/db]

  backend:
    build: ./backend
    ports: ["5000:5000"]
    env_file: ./backend/.env        # copy backend/.env.example -> backend/.env first
    environment:
      MONGO_URI: "mongodb://mongodb:27017/fitness_db"   # local Mongo; remove to use Atlas from .env
    depends_on: [mongodb]

  frontend:
    build: ./frontend
    ports: ["3000:3000"]
    environment:
      VITE_BACKEND_URL: "http://localhost:5000"
    depends_on: [backend]

volumes:
  mongodb_data:
